name: Local Fallback Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore R packages
        uses: r-lib/actions/setup-renv@v2

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and randomized policy tests
        run: make test

      - name: Run local fallback pipeline and public audit
        run: make local-all

      - name: Generate Snowflake offline lineage
        run: make snowflake-docs
